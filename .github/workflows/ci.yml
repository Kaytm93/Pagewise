name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks prüft auch den Verlauf
          persist-credentials: false

      - uses: pnpm/action-setup@v6 # Version aus "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build der Oberfläche
        run: pnpm --filter @pagewise/web build

      - name: Secret-Scan (eigenes Skript)
        run: node scripts/secret-scan.mjs --all

      # gitleaks als Programm mit festem Hash statt gitleaks-Action: Die Action berechnet beim
      # ersten Push den Bereich "Vorgänger des ersten Commits bis HEAD", und der fehlt beim
      # Root-Commit (Lauf schlug mit "unknown revision" fehl). So wird der gesamte Verlauf geprüft
      # und es ist auch in Organisationen kein Lizenzschlüssel nötig.
      - name: Secret-Scan (gitleaks, gesamter Verlauf)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: Abhängigkeiten prüfen
        run: pnpm audit --audit-level high
